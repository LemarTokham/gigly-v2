<!doctype html>
<html lang="en">
  <body style="font-family: Helvetica, Arial, sans-serif; line-height: 1.5; color: #17131D;">
    <h2 style="margin:0 0 12px">Your Gigly sign-in link</h2>
    <p style="margin:0 0 20px">Tap to sign in. The link works once and expires in an hour.</p>
    <p style="margin:0 0 20px">
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
        style="background:#F0284A;color:#fff;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:700;display:inline-block"
        >Sign in to Gigly</a
      >
    </p>
    <p style="margin:0;color:#6A6472;font-size:14px">
      If you didn't ask for this, you can ignore it.
    </p>
  </body>
</html>
